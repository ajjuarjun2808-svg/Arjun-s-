<a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Loops" target="_blank">Good reference to Javascript Loops</a><br>

<h4>Example input output code</h4>

Max loops: <input id="myNum01" type="number" value="4"><br>
weird number: <input id="myWeird" type="number" value="2"><br>

<input type="button" value="Basic for loops with Decisions" onclick="basicForLoopsWithDecisions()">
<input type="button" value="Even number identifier" onclick="evenNumberIdentifier()">

<div id="myDiv01" style="color:red">...</div>

<script>
function basicForLoopsWithDecisions() {
    const myMax = parseInt(document.getElementById('myNum01').value) || 0;
    const myWeird = parseInt(document.getElementById('myWeird').value) || 0;
    let myTemp = '';

    for (let myLoop = 0; myLoop < myMax; myLoop++) {
        if (myLoop === myWeird) {
            myTemp += 'Weird number found: ' + myLoop + '<br>';
        } else if (myLoop % 2 === 0) {
            myTemp += 'Even Number: ' + myLoop + '<br>';
        } else {
            myTemp += 'Odd Number: ' + myLoop + '<br>';
        }
    }

    document.getElementById('myDiv01').innerHTML = myTemp;
}

function evenNumberIdentifier() {
    const myMax = parseInt(document.getElementById('myNum01').value) || 0;
    let myTemp = '';

    for (let myLoop = 0; myLoop < myMax; myLoop++) {
        if (myLoop % 2 === 0) {
            myTemp += 'Even Number: ' + myLoop + '<br>';
        } else {
            myTemp += 'Loop number: ' + myLoop + '<br>';
        }
    }

    document.getElementById('myDiv01').innerHTML = myTemp;
}
</script>
